name: CI

# Chạy test khi mở/cập nhật PR vào main và khi push lên main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài dependency tối thiểu cho test
        # Test không cần torch/lightgbm/FM -> cài gọn để CI nhanh & ổn định.
        run: |
          python -m pip install --upgrade pip
          pip install "pandas==2.3.3" "numpy==2.2.6" "pyarrow==25.0.1" \
                      "scipy==1.17.1" "PyYAML==6.0.3" "pytest==9.1.1"

      - name: Chạy unit test
        env:
          PYTHONUTF8: "1"
        run: python -m pytest tests/ -q
